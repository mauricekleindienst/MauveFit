name: Android

on:
  push:
    branches: [main]
    paths: ["app/**", "wear/**", "ios/MauveFit/Resources/**", "gradle/**", "*.gradle.kts", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "wear/**", "ios/MauveFit/Resources/**", "gradle/**", "*.gradle.kts", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests of the phone app, then debug builds of phone and watch app.
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-report
          path: app/build/reports/tests/
          retention-days: 7
