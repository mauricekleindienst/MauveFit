name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      # Store texts and screenshots have their own workflow and need no new build.
      - "!ios/fastlane/**"
      - "app/src/main/assets/exercise*.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Liquid Glass needs the iOS 26 SDK.
          ls -d /Applications/Xcode*.app
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          # The newest runtime (iOS 26, for the glass), on an iPhone 17 Pro or 16 Pro, else any iPhone.
          runtime = [k for k in ios if any(d["name"].startswith("iPhone") for d in devs[k])][-1]
          print(runtime, file=sys.stderr)
          for want in ("iPhone 17 Pro", "iPhone 16 Pro", "iPhone"):
              for d in devs[runtime]:
                  if d["name"] == want or (want == "iPhone" and d["name"].startswith("iPhone")):
                      print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Screenshots are taken in dark mode.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MauveFit.xcodeproj -scheme MauveFit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            -only-testing:MauveFitTests \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|warning: .*MauveFit|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Take screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project MauveFit.xcodeproj -scheme MauveFit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            -only-testing:MauveFitUITests \
            -skip-testing:MauveFitUITests/StoreScreenshots \
            -resultBundlePath build/screens.xcresult \
            -testLanguage de -testRegion DE | tee build-screens.log | grep -E "error:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-screens.log
          mkdir -p build/attachments build/screenshots
          xcrun xcresulttool export attachments --path build/screens.xcresult --output-path build/attachments
          # Files come out under generated names; manifest.json maps them to the names the test gave.
          python3 - <<'PY'
          import json, re, shutil
          for test in json.load(open("build/attachments/manifest.json")):
              for a in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-F-]{36}", "", a.get("suggestedHumanReadableName", a["exportedFileName"]))
                  if not name.endswith(".png"):
                      name += ".png"
                  shutil.copy("build/attachments/" + a["exportedFileName"], "build/screenshots/" + name)
          PY
          # The store screens in German and English too, to catch leftover strings of the other language.
          for lang in de en; do
            TEST_RUNNER_STORE_LANG=$lang xcodebuild test \
              -project MauveFit.xcodeproj -scheme MauveFit \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build/test \
              -only-testing:MauveFitUITests/StoreScreenshots \
              -resultBundlePath build/store-$lang.xcresult | tee build-store-$lang.log | grep -E "error:|Test Case|\*\* TEST" || true
            grep -q "\*\* TEST SUCCEEDED \*\*" build-store-$lang.log
            mkdir -p build/attachments-$lang
            xcrun xcresulttool export attachments --path build/store-$lang.xcresult --output-path build/attachments-$lang
            python3 - "$lang" <<'PY'
          import json, re, shutil, sys
          lang = sys.argv[1]
          for test in json.load(open(f"build/attachments-{lang}/manifest.json")):
              for a in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-F-]{36}", "", a.get("suggestedHumanReadableName", a["exportedFileName"]))
                  name = name if name.endswith(".png") else name + ".png"
                  shutil.copy(f"build/attachments-{lang}/" + a["exportedFileName"], f"build/screenshots/store-{lang}-" + name)
          PY
          done
          ls -l build/screenshots
          test "$(ls build/screenshots/*.png | wc -l)" -ge 32

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MauveFit-iOS-screenshots
          path: ios/build/screenshots/*.png
          if-no-files-found: error

      - name: Build unsigned ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project MauveFit.xcodeproj -scheme MauveFit -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-release.log
          mkdir -p build/ipa/Payload
          cp -R build/release/Build/Products/Release-iphoneos/MauveFit.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../MauveFit-unsigned.ipa Payload)
          ls -lh build/MauveFit-unsigned.ipa
          du -sh build/ipa/Payload/MauveFit.app
          echo "Drawings: $(cat build/ipa/Payload/MauveFit.app/ek-*.png | wc -c) bytes"
          # App Review: the privacy manifest is in, and nothing points to the old image CDN.
          test -f build/ipa/Payload/MauveFit.app/PrivacyInfo.xcprivacy
          ! grep -rqs "jsdelivr\|gymvisual" build/ipa/Payload/MauveFit.app

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: MauveFit-unsigned-ipa
          path: ios/build/MauveFit-unsigned.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ios/build-*.log

  # Signed with automatic signing through the App Store Connect API key, uploaded to TestFlight.
  testflight:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | grep -v -i beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          # The key goes to a private temp file and is never printed; it is removed at the end.
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"
          fi
          trap 'rm -f "$key"' EXIT
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Same version as the Android app; the build number counts up with every run.
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' ../app/build.gradle.kts | head -1)
          test -n "$version"
          echo "Version $version ($BUILD_NUMBER)"
          mkdir -p build
          xcodebuild archive \
            -project MauveFit.xcodeproj -scheme MauveFit -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/MauveFit.xcarchive \
            "${auth[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee build-archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build-archive.log
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/MauveFit.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${auth[@]}" 2>&1 | tee build-upload.log | grep -E -i "error|upload|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build-upload.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: ios/build-*.log
