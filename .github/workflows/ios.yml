name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "app/src/main/assets/exercise*.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")])
          # An iPhone 16 Pro on the newest runtime, else any iPhone.
          for want in ("iPhone 16 Pro", "iPhone"):
              for runtime in reversed(ios):
                  for d in devs[runtime]:
                      if d["name"] == want or (want == "iPhone" and d["name"].startswith("iPhone")):
                          print(d["udid"]); sys.exit()
          ')
          echo "Simulator: $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Screenshots are taken in dark mode.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance dark

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MauveFit.xcodeproj -scheme MauveFit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            -only-testing:MauveFitTests \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|warning: .*MauveFit|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Take screenshots
        run: |
          set -o pipefail
          xcodebuild test \
            -project MauveFit.xcodeproj -scheme MauveFit \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            -only-testing:MauveFitUITests \
            -resultBundlePath build/screens.xcresult \
            -testLanguage de -testRegion DE | tee build-screens.log | grep -E "error:|Test Case|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-screens.log
          mkdir -p build/attachments build/screenshots
          xcrun xcresulttool export attachments --path build/screens.xcresult --output-path build/attachments
          # Files come out under generated names; manifest.json maps them to the names the test gave.
          python3 - <<'PY'
          import json, re, shutil
          for test in json.load(open("build/attachments/manifest.json")):
              for a in test.get("attachments", []):
                  name = re.sub(r"_\d+_[0-9A-F-]{36}", "", a.get("suggestedHumanReadableName", a["exportedFileName"]))
                  if not name.endswith(".png"):
                      name += ".png"
                  shutil.copy("build/attachments/" + a["exportedFileName"], "build/screenshots/" + name)
          PY
          ls -l build/screenshots
          test "$(ls build/screenshots/*.png | wc -l)" -ge 6

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: MauveFit-iOS-screenshots
          path: ios/build/screenshots/*.png
          if-no-files-found: error

      - name: Build unsigned ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project MauveFit.xcodeproj -scheme MauveFit -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build/release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-release.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-release.log
          mkdir -p build/ipa/Payload
          cp -R build/release/Build/Products/Release-iphoneos/MauveFit.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../MauveFit-unsigned.ipa Payload)
          ls -lh build/MauveFit-unsigned.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: MauveFit-unsigned-ipa
          path: ios/build/MauveFit-unsigned.ipa
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ios/build-*.log
