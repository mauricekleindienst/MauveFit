# XcodeGen spec: `xcodegen generate` in this folder writes MauveFit.xcodeproj (not checked in).
name: MauveFit
options:
  bundleIdPrefix: dev.mauve
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The exercise data is copied from the Android assets by a script phase.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MauveFit:
    type: application
    platform: iOS
    sources:
      - path: MauveFit
        excludes:
          - PrivacyInfo.xcprivacy
      # Privacy manifest: no tracking, no data collected, no required-reason APIs.
      - path: MauveFit/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mauve.fit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mauve Fit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        # The Android launcher icon, rendered at 1024 px (App Store Connect refuses builds without one).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # One alternate icon per accent (#19): the mark in the accent colour, switched with the accent.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-sand AppIcon-sage AppIcon-blue AppIcon-mauve AppIcon-lime AppIcon-gold AppIcon-ruby AppIcon-emerald AppIcon-ocean AppIcon-rose
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    # Apple Health: workouts and body weight, only when switched on in Settings.
    entitlements:
      path: MauveFit/MauveFit.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: MauveFit/Info.plist
      properties:
        CFBundleLocalizations: [de, en]
        CFBundleAllowMixedLocalizations: true
        # The page colour of the theme, so the start fades straight into the app.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Only HTTPS from the system: no export compliance questions per TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        # English defaults; de.lproj/InfoPlist.strings has the German texts.
        NSHealthShareUsageDescription: Mauve Fit reads your latest body weight from Apple Health to set your daily calorie and protein targets.
        NSHealthUpdateUsageDescription: Mauve Fit saves your finished workouts as strength training and the body weights you log to Apple Health.
    postCompileScripts:
      - name: Copy exercise data
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/../app/src/main/assets/exercises.json
          - $(SRCROOT)/../app/src/main/assets/exercises_de.json
          - $(SRCROOT)/../app/src/main/assets/exercise_names_de.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/exercises.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/exercises_de.json
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/exercise_names_de.json
        script: |
          set -e
          src="$SRCROOT/../app/src/main/assets"
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$dst"
          for f in exercises.json exercises_de.json exercise_names_de.json; do
            cp "$src/$f" "$dst/$f"
          done
  MauveFitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MauveFitTests
    dependencies:
      - target: MauveFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mauve.fit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MauveFit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MauveFit
        BUNDLE_LOADER: $(TEST_HOST)
  MauveFitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MauveFitUITests
    dependencies:
      - target: MauveFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mauve.fit.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MauveFit
schemes:
  MauveFit:
    build:
      targets:
        MauveFit: all
        MauveFitTests: [test]
        MauveFitUITests: [test]
    test:
      targets:
        - MauveFitTests
        - MauveFitUITests
      gatherCoverageData: false
